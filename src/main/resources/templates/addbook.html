<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Book</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body>

    <h1>Add Book</h1>
    <div>
        <form th:object="${book}" th:action="@{/save}" action="#" method="post">

            <div> <label for="author">Author:</label>
                <input type="text" id="author" th:field="*{author}" />
            </div>

            <div>
                <label for="title">Title:</label>
                <input type="text" id="title" th:field="*{title}" />
            </div>

            <div>
                <label for="isbn">ISBN:</label>
                <input type="text" id="isbn" th:field="*{isbn}" />
            </div>

            <div>
                <label for="year">Publishing Year:</label>
                <input type="text" id="year" th:field="*{publicationYear}" />
            </div>

            <div>
                <label for="price">Price:</label>
                <input type="text" id="price" th:field="*{price}" />
            </div>

            <input type="submit" value="Save">
        </form>
    </div>

</body>

</html>
